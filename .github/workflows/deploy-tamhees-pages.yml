name: Deploy Tamhees to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "tamhees-host/**"
      - ".github/workflows/deploy-tamhees-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "tamhees-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tamhees-host
      - id: deployment
        uses: actions/deploy-pages@v4
