<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تمحيص</title></head><body><div id="loading" style="font-family:system-ui;padding:40px;text-align:center">جارٍ تحميل تمحيص…</div><script>(async()=>{try{const files=["p01.txt","p02.txt","p03.txt","p04.txt","p05a.txt","p05b.txt","p05c.txt","p05d.txt","p06.txt"];const parts=await Promise.all(files.map(f=>fetch(`parts/${f}`).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));const b64=parts.join('');const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();const extra='<script src="./standards/bridge.js"><'+'/script>';const patched=html.replace(/<\/body>/i,extra+'</body>');document.open();document.write(patched);document.close()}catch(e){document.body.innerHTML='<pre style="direction:ltr;white-space:pre-wrap">Load error: '+e+'</pre>'}})();</script></body></html>
